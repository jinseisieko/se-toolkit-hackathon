[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logsentinel"
version = "0.1.0"
description = "Real-time server security monitor with log parsing, auto-blocking, and Telegram alerts"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "peewee>=3.17",
    "python-telegram-bot>=20.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-asyncio>=0.24",
    "mypy>=1.8",
    "flake8>=7.0",
    "pylint>=3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_ignores = true
