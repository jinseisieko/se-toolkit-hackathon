services:
  worker:
    build: .
    container_name: logsentinel-worker
    command: python -m src.worker
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - /var/log/auth.log:/var/log/auth.log:ro
      - ./data:/app/data
    env_file: .env
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build: .
    container_name: logsentinel-web
    command: python -m src.web
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - ./data:/app/data
    env_file: .env
    restart: unless-stopped

  telegram:
    build: .
    container_name: logsentinel-telegram
    command: python -m src.adapters.telegram_worker
    network_mode: host
    volumes:
      - ./data:/app/data
    env_file: .env
    environment:
      - WORKER_API_URL=http://localhost:5000
    restart: unless-stopped
