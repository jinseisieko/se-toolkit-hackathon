services:
  logsentinel:
    build: .
    container_name: logsentinel
    command: python -m src.worker
    volumes:
      - /var/log/auth.log:/var/log/auth.log:ro
      - ./data:/app/data
    env_file: .env
    ports:
      - "5000:5000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
